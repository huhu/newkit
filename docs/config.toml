# The URL the site will be built for
base_url = "/"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false
theme = "juice"

# Configuration of the Markdown rendering
[markdown]
# CI installs Zola 0.17.2 and publishes docs/public to the `now` branch.
# highlight_code/highlight_theme are omitted so this file still builds on
# Zola 0.22, which removed them. Keep external_links_external off so
# rendered links match the 0.17.2 output.
external_links_external = false

[extra]
# Put all your custom variables here
juice_logo_name = "Newkit"
juice_logo_path = "logo.svg"
juice_extra_menu = [
    { title = "Geddle", link = "https://geddle.com" },
    { title = "Github", link = "https://github.com/huhu/newkit"}
]
meta_title = "Newkit"
meta_description = "Oh My Newkit!"
