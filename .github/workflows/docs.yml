name: Deploy docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.17.2

      - name: Build docs
        run: cd docs && zola build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          # newkit Pages project (same account id as the GitHub check URLs).
          accountId: "8061dbdcbf07c89772f0942f60e775aa"
          # Detached HEAD cannot infer the production branch, so pass it.
          command: pages deploy docs/public --project-name=newkit --branch=master
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "3"
